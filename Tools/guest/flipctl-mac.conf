[Unit]
Wants=user@1000.service
After=user@1000.service

[Service]
Environment=XDG_RUNTIME_DIR=/run/user/1000
Environment=DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus
Environment=WLR_RENDERER=pixman
Environment=LIBGL_ALWAYS_SOFTWARE=1
Environment=FLIPCTL_NO_GPU=1
Environment=SDL_RENDER_DRIVER=software
Environment=SDL_AUDIODRIVER=pulseaudio
Environment=PULSE_SERVER=unix:/run/user/1000/pulse/native
Environment=PULSE_RUNTIME_PATH=/run/user/1000/pulse
Environment=PIPEWIRE_RUNTIME_DIR=/run/user/1000
Environment=FLIPCTL_AUDIO_SINK=flipper_mac_speaker
ExecStartPre=-/usr/bin/systemctl --user start pipewire.service pipewire-pulse.service wireplumber.service
